    //可拖拽徽章空间
    implementation 'cn.bingoogolapple:bga-badgeview-api:1.1.8'
    annotationProcessor "cn.bingoogolapple:bga-badgeview-compiler:1.1.8"

    //********************友盟************************
    //基础组件库依赖(必须)
    implementation 'com.umeng.umsdk:common:9.1.0'       //基础和移动统计合二为一
//    implementation 'com.umeng.umsdk:utdid:1.5.2'      //跟支付宝支付冲突

    implementation 'com.umeng.umsdk:asms:1.1.3'         //这个有啥用？（没有就会弹SDK初始化失败的吐司）
    implementation 'com.umeng.umsdk:crash:0.0.4'         //异常捕捉

    implementation 'com.umeng.umsdk:push:6.0.1'
    //小米Push通道
    implementation 'com.umeng.umsdk:xiaomi-push:3.6.17'
    implementation 'com.umeng.umsdk:xiaomi-umengaccs:1.1.0'
    //PushSDK

    //shareSDK
    /*implementation files('libs/umeng-share-QQ-simplify-6.9.8.jar')
    implementation files('libs/umeng-share-core-6.9.8.jar')
    implementation files('libs/umeng-share-wechat-simplify-6.9.8.jar')
    implementation files('libs/umeng-shareboard-widget-6.9.8.jar')
    implementation files('libs/umeng-sharetool-6.9.8.jar')*/
    //********************友盟************************
    //微信支付
    implementation 'com.tencent.mm.opensdk:wechat-sdk-android-with-mta:5.4.0'
    implementation project(path: ':flycoTabLayout_lib')
    //Alipay支付
//    implementation(name: 'alipaySdk-15.7.4-20200228192259', ext: 'aar')

//    implementation(name: 'CTAccountSdk_HY_v3.7.2_all', ext: 'aar')
//    implementation(name: 'ShareInstall_v1.2.6', ext: 'aar')
//    implementation(name: 'ShareInstallAutoLogin_v1.2.6', ext: 'aar')
