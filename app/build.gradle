apply plugin: 'com.android.application'
apply plugin: 'org.greenrobot.greendao'

android {
    compileSdkVersion 29
    defaultConfig {
        applicationId "com.huli.foxread"
        minSdkVersion 23
        targetSdkVersion 29
        versionCode 26
        versionName "1.2.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true

        // 添加一个默认渠道号
//        manifestPlaceholders = [UMENG_CHANNEL_VALUE: "Umeng"]
        flavorDimensions "versionCode"

        ndk {
            abiFilters "armeabi-v7a"
            abiFilters 'armeabi'
            abiFilters 'arm64-v8a'
        }

        javaCompileOptions {
            //告知RxHttp你依赖的okhttp版本，目前已适配 v3.12.0 - v4.7.2版本
            annotationProcessorOptions {
                arguments = [
                        rxhttp_okhttp : '4.7.2',
                        rxhttp_rxjava : 'rxjava3', //告知RxHttp你依赖的rxjava版本，可传入rxjava2、rxjava3
                        rxhttp_package: 'com.huli.foxread'   //指定RxHttp相关类的生成路径，即包名
                ]
            }
        }
        compileOptions {
            sourceCompatibility JavaVersion.VERSION_1_8
            targetCompatibility JavaVersion.VERSION_1_8
        }
    }

    signingConfigs {
        debug {
//            storeFile file("C:/Users/hp/.android/debug.keystore")
            storeFile file("C:/Users/Lili/.android/debug.keystore")
//            storePassword "android"
//            keyAlias "androiddebugkey"
//            keyPassword "android"
//            storeFile file("E:/android/as_project/FoxRead/doc/hytc_keystore.jks")
//            storePassword "hytc1688"
//            keyAlias "hytc"
//            keyPassword "hytc1688"
        }
        release {// 自己的签名文件
            storeFile file("E:/android/as_project/FoxRead/doc/hytc_keystore.jks")
//            storeFile file("D:/android/FoxRead/doc/hytc_keystore.jks")
            storePassword "hytc1688"
            keyAlias "hytc"
            keyPassword "hytc1688"
        }
    }

    //Caused by: org.gradle.api.GradleException: Lint found fatal errors while assembling a release target.
    //添加如下配置
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildTypes {
        debug {
            buildConfigField "boolean", "LOG_DEBUG", "true"
            versionNameSuffix "-debug"
            zipAlignEnabled false
            shrinkResources false
            minifyEnabled false
//            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        release {
            // 不显示Log
            buildConfigField "boolean", "LOG_DEBUG", "false"
            //混淆
            minifyEnabled true
            //false
            zipAlignEnabled true
            // 移除无用的resource文件，shrinkResources依赖于minifyEnabled,必须一起用
            shrinkResources true
            //前一部分代表系统默认的android程序的混淆文件，该文件已经包含了基本的混淆声明，后一个文件是自己的定义混淆文件
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            //签名
            signingConfig signingConfigs.release

            applicationVariants.all { variant ->
                variant.outputs.all { output ->
                    //定义apk名字
                    def formatedTime = new Date().format("yyyy-MM-dd")
                    def apkFileName = "foxread_app_v${android.defaultConfig.versionName}_${formatedTime}.apk"
                    outputFileName = apkFileName
                }
            }
        }
    }

    //多渠道打包支持
    productFlavors {
        Invite {}//自己的邀请链接下载
        /* Aalpha {
 //            applicationId "info.xinfu.o2o"//设置包名
 //            versionCode 2
 //            versionName "3.1"//设置版本号
         }//自己打包测试使用*/
        Tencent {}//投放应用宝市场
        TencentGDT {}//投放腾讯广点通
        Baidu {
//            versionCode 1
//            versionName "3.0"
        }//投放百度市场
        PP {}//投放PP助手市场
        Qihoo {}//投放360助手市场
        Vivo {}//投放vivo市场
        Oppo {}//投放oppo市场
        Xiaomi {}//投放小米市场
        Meizu {}//投放魅族市场
        Coolpad {}//投放酷派市场
        Lenovo {}//投放联想市场
        Huawei {}//投放华为应用市场
        Lenovo {}//投放联想市场
        Samsung {}//投放三星市场
        Letv {}//投放乐视市场
        Smartisan {}//投放锤子市场
        Gionee {}//投放金立市场
        Alibaba {}//投放UC市场
        Sogou {}//投放搜狗市场
        Yingyonghui {}//投放应用汇市场
        MM {}//投放移动mm市场
        Download {}//投放下载站市场
        HiMarket {}//投放安卓市场
        Hisense {}//投放海信市场
        Toutiao {}//投放今日头条
    }
    //manifestPlaceholders 使用相关的值替换了UMENG_CHANNEL_VALUE
    productFlavors.all {
        flavor -> flavor.manifestPlaceholders = [UMENG_CHANNEL_VALUE: name]
    }

}

greendao {
    schemaVersion 1
    daoPackage 'com.huli.page.model.dao'
    targetGenDir 'src/main/java'
}

repositories {
    maven {
        url 'https://dl.bintray.com/qichuan/maven/'
    }
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    testImplementation 'junit:junit:4.13'
    androidTestImplementation 'androidx.test.ext:junit:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'

    implementation 'com.google.android.material:material:1.1.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    //okgo
    /*implementation ("com.lzy.net:okgo:3.0.4"){
        exclude group: 'com.squareup.okhttp3'
    }*/
    implementation 'com.lzy.net:okgo:3.0.4'
//    implementation 'com.lzy.net:okserver:2.0.5'

    //RxHttp
    implementation 'com.ljx.rxlife:rxlife-coroutine:2.0.0' //管理协程生命周期，页面销毁，关闭请求
    implementation 'com.ljx.rxhttp:rxhttp:2.2.7'
    annotationProcessor 'com.ljx.rxhttp:rxhttp-compiler:2.2.7'
    //生成RxHttp类，非kotlin项目，请使用annotationProcessor代替kapt
    implementation 'com.squareup.okhttp3:okhttp:4.7.2' //rxhttp v2.2.2版本起，需要手动依赖okhttp

    //rxjava3
    implementation 'io.reactivex.rxjava3:rxjava:3.0.2'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.0'
    implementation 'com.ljx.rxlife3:rxlife-rxjava:3.0.0' //管理RxJava3生命周期，页面销毁，关闭请求

    //Converter 根据自己需求选择 RxHttp默认内置了GsonConverter
//    implementation 'com.ljx.rxhttp:converter-jackson:2.2.7'
    implementation 'com.ljx.rxhttp:converter-fastjson:2.2.7'
//    implementation 'com.ljx.rxhttp:converter-protobuf:2.2.7'
//    implementation 'com.ljx.rxhttp:converter-simplexml:2.2.7'
    //RxHttp

    implementation 'com.alibaba:fastjson:1.2.62'

    //glide
    implementation 'com.github.bumptech.glide:glide:4.11.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.11.0'

    //eventbus
    implementation 'org.greenrobot:eventbus:3.2.0'

    implementation 'com.kongzue.stacklabel:stacklabelview:1.1.9'
    implementation 'com.kongzue.dialog_v3x:dialog:3.1.9'

    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:3.0.2'
//    implementation 'com.flyco.tablayout:FlycoTabLayout_Lib:2.1.2@aar'

    implementation 'me.zhanghai.android.materialratingbar:library:1.4.0'

    //屏幕适配
    implementation 'me.jessyan:autosize:1.1.2'

    //下拉刷新上拉加载
    implementation 'com.scwang.smartrefresh:SmartRefreshLayout:1.1.0'
    implementation 'com.scwang.smartrefresh:SmartRefreshHeader:1.1.0'

//    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.0.0"

    implementation 'pub.devrel:easypermissions:2.0.1'

    //轮播图
    implementation 'com.youth.banner:banner:1.4.10'
    implementation project(path: ':stepview')

    // OpenCC to convert Simp. Chinese to Trad. Chinese
    implementation 'com.zqc.opencc.android.lib:lib-opencc-android:0.8.0@aar'

    // ORM Database
    implementation 'org.greenrobot:greendao:3.2.2'
    // RxJava
    implementation 'io.reactivex.rxjava2:rxjava:2.2.0'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.0'
    //日志
    implementation 'com.orhanobut:logger:2.2.0'
    //注解
    implementation 'com.jakewharton:butterknife:10.2.1'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.1'
    //下划线
    implementation 'com.yqritc:recyclerview-flexibledivider:1.4.0'
    //动画
    implementation 'com.airbnb.android:lottie:3.0.1'
    //bug监控
    implementation 'com.tencent.bugly:crashreport_upgrade:latest.release'
    implementation 'com.tencent.bugly:nativecrashreport:latest.release'

    //App升级
    implementation 'com.azhon:appupdateX:2.9.0'

    //js交互
